services:
  spurstack:
    build: .
    image: spurstack:local
    container_name: spurstack
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:?GITHUB_REPOSITORIES is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-anthropic/claude-3.5-sonnet}
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-}
      OPENROUTER_ALLOW_FALLBACKS: ${OPENROUTER_ALLOW_FALLBACKS:-true}
      WORKSPACE_DIR: /var/lib/spurstack/workspace
      POLL_INTERVAL: ${POLL_INTERVAL:-60s}
      SPUR_LABEL: ${SPUR_LABEL:-agent-ready}
      MAX_SPUR_STEPS: ${MAX_SPUR_STEPS:-30}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Spurstack}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-spurstack@example.local}
    volumes:
      - spurstack-workspace:/var/lib/spurstack/workspace

volumes:
  spurstack-workspace:
